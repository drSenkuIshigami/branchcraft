[package]
name = "git-workbench"
version = "1.0.0"
description = "A local desktop Git workbench built with Tauri 2, Rust, React, and Vite"
authors = ["drSenkuIshigami"]
edition = "2021"

[lib]
name = "git_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
